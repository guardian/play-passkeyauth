name: Update Dependency Graph for sbt

on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  dependency-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Install Scala
        uses: guardian/setup-scala@f4bb63d5dea5e0324c89f80da36a097740ca1e6f # v1.1.1
      
      - name: Submit dependencies
        id: submit
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
        
      - name: Log snapshot for user validation
        id: validate
        run: cat ${{ steps.submit.outputs.snapshot-json-path }} | jq
